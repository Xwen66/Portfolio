<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Chatbot API Monitor</title>
  <desc id="desc">An abstract desktop interface showing a chat and API monitoring panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12231f"/>
      <stop offset="1" stop-color="#0b1514"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="40" r="220" fill="#c6aa82" opacity=".16"/>
  <rect x="82" y="74" width="1036" height="572" rx="24" fill="#f2eadc"/>
  <rect x="82" y="74" width="1036" height="56" rx="24" fill="#d9d1c4"/>
  <circle cx="122" cy="102" r="9" fill="#bd6c5c"/><circle cx="151" cy="102" r="9" fill="#d1a852"/><circle cx="180" cy="102" r="9" fill="#668c62"/>
  <text x="230" y="109" font-family="ui-monospace, monospace" font-size="18" fill="#554d43">AI SUPPORT CONSOLE</text>
  <rect x="114" y="164" width="478" height="438" rx="14" fill="#fffdf7"/>
  <text x="148" y="208" font-family="ui-monospace, monospace" font-size="17" fill="#5d554a">Conversation</text>
  <rect x="148" y="240" width="290" height="54" rx="12" fill="#e5f0e6"/>
  <text x="168" y="273" font-family="Arial, sans-serif" font-size="18" fill="#1b3020">How can I help?</text>
  <rect x="270" y="318" width="282" height="73" rx="12" fill="#d9cab5"/>
  <text x="292" y="351" font-family="Arial, sans-serif" font-size="17" fill="#342b24">Check API response time</text>
  <text x="292" y="375" font-family="Arial, sans-serif" font-size="17" fill="#342b24">and token usage.</text>
  <rect x="148" y="420" width="360" height="70" rx="12" fill="#e5f0e6"/>
  <text x="168" y="453" font-family="Arial, sans-serif" font-size="17" fill="#1b3020">Request completed successfully.</text>
  <text x="168" y="477" font-family="Arial, sans-serif" font-size="17" fill="#1b3020">Here are the details.</text>
  <rect x="148" y="530" width="410" height="40" rx="10" fill="#ece7de"/>
  <rect x="628" y="164" width="456" height="438" rx="14" fill="#151b19"/>
  <text x="660" y="208" font-family="ui-monospace, monospace" font-size="17" fill="#d6f4a7">API Monitor</text>
  <text x="660" y="260" font-family="ui-monospace, monospace" font-size="16" fill="#82c996">[REQUEST] POST /chat</text>
  <text x="660" y="296" font-family="ui-monospace, monospace" font-size="16" fill="#ece5da">model: qwen-plus-latest</text>
  <text x="660" y="332" font-family="ui-monospace, monospace" font-size="16" fill="#ece5da">latency: 0.84s</text>
  <text x="660" y="368" font-family="ui-monospace, monospace" font-size="16" fill="#ece5da">tokens: 241</text>
  <rect x="660" y="404" width="392" height="1" fill="#4b5a51"/>
  <text x="660" y="448" font-family="ui-monospace, monospace" font-size="16" fill="#82c996">[RESPONSE] 200 OK</text>
  <text x="660" y="484" font-family="ui-monospace, monospace" font-size="16" fill="#d7e5c6">status: completed</text>
  <text x="660" y="548" font-family="ui-monospace, monospace" font-size="14" fill="#9ea99d">Monitoring requests. Supporting users.</text>
</svg>
